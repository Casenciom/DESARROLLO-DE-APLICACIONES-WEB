<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}D'Patty Confecciones{% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS personalizado -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="text-center py-4">
        <h1>D'Patty Confecciones</h1>
        <p>Moda, elegancia y calidad en cada prenda</p>
    </header>


    <!-- MENÚ DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand"
               href="{{ url_for('inicio') }}">
                D'Patty
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div
                class="collapse navbar-collapse"
                id="menuPrincipal">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{{ url_for('inicio') }}">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{{ url_for('productos') }}">
                            Productos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{{ url_for('clientes') }}">
                            Clientes
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{{ url_for('proveedores') }}">
                            Proveedores
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{{ url_for('facturacion') }}">
                            Facturación
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- CONTENIDO PRINCIPAL -->
    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- PIE DE PÁGINA -->
    <footer class="bg-dark text-white text-center py-4 mt-5">

        <p class="mb-1">
            D'Patty Confecciones
        </p>

        <p class="mb-0">
            Proyecto Integrador - Desarrollo de Aplicaciones Web
        </p>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript personalizado -->
    <script
        src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
